<!DOCTYPE html>
<html>
<head>
    <title>About Me</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            padding-top: 100px;
            color: white;
        }

        .card {
            background: white;
            color: #333;
            width: 450px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
        }

        p {
            font-size: 18px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>👋 Welcome!</h1>
        <p>Click a button to learn something about me.</p>

        <button onclick="intro()">Click to know me</button>

        <button onclick="funFact()">Click for fun fact</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
